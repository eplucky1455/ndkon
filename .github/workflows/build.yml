name: Build APK Java NDK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Kode Proyek
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Beri Izin Gradle
        run: chmod +x gradlew

      - name: Bersihkan Cache & Build APK
        # Berhenti otomatis jika error, tanpa sisa cache lama
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Siapkan File APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7 # File otomatis terhapus setelah 7 hari agar bersih
